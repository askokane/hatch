name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/hatch_ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/hatch_ci
      E2E_DIRECT_URL: ${{ secrets.DIRECT_URL }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Optional native packages differ between Windows lockfile generation and
      # the Linux runner. `npm install` resolves the declared graph for the
      # runner's platform while retaining the lockfile's direct versions.
      - run: npm install
      - run: npm run security:audit
      - run: npm run verify
      - run: npx next build
      - run: npm run test:e2e
        if: env.E2E_DIRECT_URL != ''
        env:
          DIRECT_URL: ${{ env.E2E_DIRECT_URL }}
